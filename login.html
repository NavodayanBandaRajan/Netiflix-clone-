<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Login</title>

<link rel="stylesheet" href="login.css">

<style>
  *{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;

  background:
  linear-gradient(
  rgba(0,0,0,0.7),
  rgba(0,0,0,0.7)
  ),
  url("https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=1200&q=80");

  background-size:cover;
  background-position:center;

  font-family:Arial,sans-serif;
}

.logo{
  color:#E50914;
  font-size:42px;
  font-weight:bold;

  padding:25px;
}

.overlay{
  width:100%;
  min-height:100vh;
}

.login-box{

  width:90%;
  max-width:400px;

  margin:auto;
  margin-top:40px;

  background:rgba(0,0,0,0.8);

  padding:40px;

  border-radius:8px;
}

.login-box h1{
  margin-bottom:25px;
}

.login-box input{

  width:100%;
  height:50px;

  margin-bottom:15px;

  border:none;

  padding-left:15px;

  border-radius:4px;

  background:#333;
  color:white;
}

.login-box button{

  width:100%;
  height:50px;

  border:none;

  border-radius:4px;

  background:#E50914;
  color:white;

  font-size:16px;

  cursor:pointer;
}

.password-box{
  position:relative;
}

.password-box input{
  width:100%;
  height:50px;
  padding-left:15px;
  padding-right:45px;
}

#togglePassword{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:18px;
}

.options{

  margin-top:15px;

  display:flex;
  justify-content:space-between;

  font-size:14px;
}

.options a{
  color:white;
  text-decoration:none;
}
</style>

</head>
<body>

<div class="overlay">

  <div class="logo">
    NETFLIX
  </div>

  <div class="login-box">

    <h1>Sign In</h1>

    <form>

      <input
      type="email"
      placeholder="Email or phone number"
      required>

      <div class="password-box">

  <input
  type="password"
  id="password"
  placeholder="Password"
  required>

  <span id="togglePassword">
    👁
  </span>

</div>

      <button type="submit">
        Sign In
      </button>

      <div class="options">

        <label>
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">
          Forgot Password?
        </a>

      </div>

    </form>

  </div>

</div>


<script>

const password =
document.getElementById("password");

const toggle =
document.getElementById("togglePassword");

toggle.addEventListener("click",()=>{

  if(password.type==="password"){

    password.type="text";
    toggle.textContent="🙈";

  }else{

    password.type="password";
    toggle.textContent="👁";

  }

});

</script>

</body>
</html>
